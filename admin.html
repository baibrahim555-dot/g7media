<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin | G7 Media</title>
<style>
:root{--bg:#0A1530;--s:#111F42;--ac:#E5232E;--tx:#F2F4F8;--mu:#A9B4CC}*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:400 1rem/1.5 Inter,system-ui,sans-serif;padding:1.2rem;max-width:1000px;margin:auto}
h1,h2{font-family:Georgia,serif;margin:1rem 0}a{color:var(--mu)}:focus-visible{outline:3px solid #4DA3F2;outline-offset:2px}
input,select,textarea{width:100%;background:var(--s);color:var(--tx);border:1px solid #ffffff33;border-radius:8px;padding:.6rem;font:inherit;margin:.2rem 0 .8rem}input[type=color]{height:42px;padding:2px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:.6rem 1.1rem;font-weight:600;font-size:1rem;font-family:inherit;cursor:pointer}button.g{background:var(--s);border:1px solid #ffffff44}
header{display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.btn-site{display:inline-flex;align-items:center;gap:.4rem;background:var(--s);color:var(--tx);padding:.4rem .8rem;border-radius:8px;text-decoration:none;font-size:.88rem;font-weight:600;border:1px solid #ffffff33;margin-left:auto}
.btn-site:hover{background:#1b3a78}
nav{display:flex;gap:.5rem;flex-wrap:wrap;margin:1rem 0}nav button.on{outline:2px solid var(--tx)}
.c{background:var(--s);border-radius:12px;padding:1rem;margin-bottom:.8rem}.k{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.8rem}.k b{font:700 2.2rem Georgia,serif;display:block}
label{color:var(--mu);font-size:.9rem}#m{min-height:1.4em;color:#9fd2ff}
</style></head><body>
<header>
  <h1>Admin G7 Media</h1>
  <a href="index.html" target="_blank" class="btn-site">🌐 Retour au site</a>
  <span id="me"></span>
</header>
<p id="m" role="status"></p>

<!-- Écran de connexion Admin -->
<div id="lo" class="c" style="max-width:420px">
  <label for="nm">Nom</label><input id="nm" autocomplete="username">
  <label for="cd">Code d'accès (12 caractères minimum)</label><input id="cd" type="password" autocomplete="current-password">
  <button id="go">Entrer</button> <button id="su" class="g">Créer le propriétaire (première fois)</button>
</div>

<!-- Panneau Administration -->
<div id="ap" hidden>

  <nav id="tb"></nav>
  <div id="v"></div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exifr@7.1.3/dist/lite.umd.js"></script>
<script src="js/medias.js"></script>
<script src="js/admin.js"></script></body></html>
